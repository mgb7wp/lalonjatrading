# Configuracion de Alembic.
#
# La URL de la base de datos NO esta aqui: la pone env.py leyendo el entorno.
# Escribirla en este fichero significaria versionar una cadena de conexion, y el
# dia que lleve contrasena de produccion ya sera tarde.

[alembic]
script_location = backend/db/migrations
prepend_sys_path = .
path_separator = os
# Las migraciones se ordenan por nombre en el listado del directorio, asi que el
# prefijo de fecha hace legible el historial sin abrir cada fichero.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
