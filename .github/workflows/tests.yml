# Ejecuta los tests en GitHub cada vez que se sube un cambio (tarea A4 de PLAN.md).
#
# No usa red para los datos ni claves: los tests tiran del proveedor sintetico
# y de la configuracion fija de tests/config_prueba/.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[panel,dev]"

      - name: Ejecutar los tests
        run: pytest -q
