# Enlace entre los tickers de B3 y las empresas de la CVM.
#
# La CVM identifica a cada emisor por su CNPJ y **no publica el ticker por
# ningún lado**: lo he comprobado en su fichero de registro, que trae razón
# social, sector y domicilio, pero ningún código de negociación. Así que el
# enlace hay que construirlo, y vive aquí porque es un dato, no código.
#
# ── POR QUÉ ESTÁ ESCRITO A MANO ──────────────────────────────────────────────
#
# Lo primero que probé fue emparejar por parecido de nombre. Acierta en 22 de 28
# y se equivoca en el resto **con aplomo**: a Eletrobras le asignó el CNPJ de
# Petrobras con un 0,84 de similitud, por debajo de cualquier umbral de aviso
# razonable. Un CNPJ equivocado no rompe nada: calcula las cuentas de otra
# empresa y las sirve como si fueran las buenas.
#
# Por eso cada línea está resuelta a mano con dos criterios: la razón social y
# `TP_MERC = BOLSA` en el registro de la CVM, que distingue a la sociedad
# cotizada de sus filiales y de la sociedad tenedora.
#
# ── Y POR QUÉ ADEMÁS SE COMPROBARÁ SOLO ──────────────────────────────────────
#
# Mi criterio no basta. `scripts/verify_sources.py` contrasta los ingresos que
# devuelve la CVM con los que devuelve yfinance para el mismo ticker: si el CNPJ
# está mal, las cifras no se parecen y salta. Un mapeo equivocado tiene que ser
# un error ruidoso, no una empresa analizada con las cuentas de otra.
#
# ── TRAMPAS ENCONTRADAS ──────────────────────────────────────────────────────
#
# - ELET3 figura como AXIA ENERGIA S.A.: Eletrobras se cambió el nombre. Es
#   exactamente el riesgo RD-5 (cambios de nombre y de ticker) en vivo.
# - SUZB3 es SUZANO S.A., no SUZANO HOLDING S.A., que es otra sociedad.
# - RENT3 es LOCALIZA RENT A CAR, no LOCALIZA FLEET, que es una filial.
# - EQTL3 es EQUATORIAL S.A., la tenedora, no sus distribuidoras regionales,
#   que también cotizan.
# - TIMS3 es TIM S.A., no TIM BRASIL SERVIÇOS, que no cotiza.
#
# Bajas del 16/09/2026: BRFS3 (fusión con Marfrig → MBRF3) y JBSS3 (traslado
# a NYSE; en B3 solo quedan BDR). Salen de aquí porque salen del universo:
# ver `activo: false` en universo.yaml, donde queda constancia de por qué.

