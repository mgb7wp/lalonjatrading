# Universo de partida, agrupado por mercado.
#
# AVISO: esta lista es un PUNTO DE PARTIDA sin verificar contra el proveedor de
# datos. Los tickers, los nombres y sobre todo los sectores hay que revisarlos
# la primera vez que se descarguen datos reales: algunos valores cambian de
# ticker, cambian de mercado principal o dejan de cotizar. El informe avisa de
# los que el proveedor no reconoce.
#
# Bancos, aseguradoras e inmobiliarias estan deliberadamente fuera, como pide
# el documento (ratios como deuda neta/EBITDA o EV/EBIT no son significativos
# para ellas). El filtro por sector vuelve a comprobarlo con el dato del
# proveedor, asi que esta ausencia es una conveniencia, no la salvaguarda.
#
# `sector_declarado` es solo un respaldo para cuando el proveedor no devuelve
# sector. El sector que manda es el del proveedor, mapeado en
# config/implementacion.yaml.

