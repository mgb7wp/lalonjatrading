[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estrategia"
version = "0.2.0"
description = "Estrategia mixta (fundamental + tecnica) multi-mercado, segun ESTRATEGIA.md"
requires-python = ">=3.11,<4"
dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "pyyaml>=6,<7",
    "pydantic>=2.6,<3",
    "pyarrow>=14",
    "exchange-calendars>=4.5,<5",
    "yfinance>=0.2.40",
    "tabulate>=0.9",
]

[project.optional-dependencies]
panel = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=8", "pytest-cov>=4"]

[project.scripts]
estrategia = "estrategia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
